services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novelbrain
      POSTGRES_PASSWORD: novelbrain
      POSTGRES_DB: novelbrain
    ports:
      - "5434:5432"
    volumes:
      - novelbrain-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  novelbrain-postgres:
